[project]
name = "payment-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn[standard]>=0.34,<0.35",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1", "asyncpg>=0.30,<0.31",
  "alembic>=1.14,<2", "faststream[rabbit]>=0.5.48,<0.6",
  "httpx>=0.28,<0.29",
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<0.26", "aiosqlite>=0.21,<0.22", "ruff>=0.11,<0.12"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and RabbitMQ"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
